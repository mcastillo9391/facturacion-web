name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: sumptuous-fact
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore backend/Facturacion.API/Facturacion.API.csproj

      - name: Compilar
        run: dotnet build backend/Facturacion.API/Facturacion.API.csproj --configuration Release --no-restore

      - name: Publicar
        run: dotnet publish backend/Facturacion.API/Facturacion.API.csproj -c Release -o publish

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: Production

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: publish

      - name: Deploy Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish